name: Update All Idaho Fishing Data

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "build_idaho_public_fishing_access.py"
      - "build_idaho_fishing_report_database.py"
      - "build_admin_dashboard_files.py"
      - "config/**"
      - "data/public_social_reports.csv"
      - ".github/workflows/update-all-idaho-fishing-data.yml"
  schedule:
    - cron: "17 13 * * *"

permissions:
  contents: write

concurrency:
  group: all-idaho-fishing-data
  cancel-in-progress: false

jobs:
  update-all-fishing-data:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install report parser
        run: python -m pip install --disable-pip-version-check beautifulsoup4==4.13.4

      - name: Build verified public waters and access points
        run: python build_idaho_public_fishing_access.py --output-dir data

      - name: Build fishing-report search database
        run: |
          python build_idaho_fishing_report_database.py             --access-file data/idaho_public_fishing_access.json             --aliases-file config/water_aliases.json             --social-file data/public_social_reports.csv             --output-dir data

      - name: Build admin dashboard files
        run: |
          python build_admin_dashboard_files.py             --database data/idaho_fishing_report_database.json             --output-dir .

      - name: Validate all 44 counties and output files
        shell: bash
        run: |
          test -s data/idaho_public_fishing_access.json
          test -s data/idaho_fishing_report_database.json
          test -s data/idaho_fishing_report_database.js
          test -s data/idaho_fishing_report_database.csv
          test -s recent_fishing_reports.js
          test -s update_status.js
          python - <<'PY'
          import json
          from pathlib import Path

          access = json.loads(
              Path("data/idaho_public_fishing_access.json").read_text()
          )
          reports = json.loads(
              Path("data/idaho_fishing_report_database.json").read_text()
          )

          assert access["county_count"] == 44
          assert reports["county_count"] == 44
          assert len(reports["counties"]) == 44
          assert reports["counties"][0]["county"] == "Ada"
          assert reports["counties"][-1]["county"] == "Washington"
          assert [c["county_number"] for c in reports["counties"]] == list(
              range(1, 45)
          )
          assert reports["metadata"]["public_access_only"] is True
          print("Public waters:", reports["public_water_count"])
          print("Current report records:", reports["report_count"])
          PY

      - name: Commit data and admin dashboard changes
        shell: bash
        run: |
          if [[ -z "$(git status --porcelain -- data recent_fishing_reports.js update_status.js)" ]]; then
            echo "No fishing-data or admin-dashboard changes to commit."
            exit 0
          fi

          git config user.name "Fish Finder Outdoors Data Builder"
          git config user.email "actions@users.noreply.github.com"
          git add data recent_fishing_reports.js update_status.js
          git commit -m "Update Idaho public access, reports and admin dashboard"
          git push
