name: Clean Nevada Fishing Data — Verified Public Access

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "build_nevada_fishing_data.py"
      - "build_nevada_fishing_data_clean.py"
      - ".github/workflows/update-all-nevada-fishing-data.yml"
  schedule:
    - cron: "37 15 * * *"

permissions:
  contents: write

concurrency:
  group: clean-nevada-fishing-data-verified-access
  cancel-in-progress: false

jobs:
  clean-nevada-build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install official-page parser
        run: python -m pip install --disable-pip-version-check beautifulsoup4==4.13.4

      - name: Run clean Nevada safety tests
        run: python build_nevada_fishing_data_clean.py --self-test

      - name: Build clean Nevada public-access database
        run: |
          python build_nevada_fishing_data_clean.py \
            --root . \
            --output-dir data

      - name: Validate clean Nevada outputs
        shell: bash
        run: |
          set -euo pipefail

          test -s data/nevada_counties.csv
          test -s config/nevada_counties.json
          test -s data/nevada_public_fishing_access.json
          test -s data/nevada_public_fishing_access.js
          test -s data/nevada_fishing_report_database.json
          test -s data/nevada_fishing_report_database.js
          test -s data/nevada_fishing_report_database.csv
          test -s data/nevada_unverified_fishable_waters.json
          test -s data/nevada_access_source_audit.json
          test -s data/nevada_project_status.json
          test -s nevada-county-reports.html
          test -s recent_fishing_reports.js
          test -s update_status.js

          python - <<'PY'
          import json
          import re
          from pathlib import Path

          access = json.loads(Path("data/nevada_public_fishing_access.json").read_text())
          reports = json.loads(Path("data/nevada_fishing_report_database.json").read_text())
          unverified = json.loads(Path("data/nevada_unverified_fishable_waters.json").read_text())
          audit = json.loads(Path("data/nevada_access_source_audit.json").read_text())
          status = json.loads(Path("data/nevada_project_status.json").read_text())

          expected = [
              "Carson City", "Churchill", "Clark", "Douglas", "Elko", "Esmeralda",
              "Eureka", "Humboldt", "Lander", "Lincoln", "Lyon", "Mineral", "Nye",
              "Pershing", "Storey", "Washoe", "White Pine",
          ]

          assert access["county_count"] == 17
          assert reports["county_count"] == 17
          assert [row["county"] for row in reports["counties"]] == expected
          assert [row["county_number"] for row in reports["counties"]] == list(range(1, 18))

          metadata = reports["metadata"]
          assert metadata["public_access_only"] is True
          assert metadata["fishnv_is_access_verification"] is False
          assert metadata["version"].startswith("4.0-clean-nevada")
          assert metadata["dead_ndow_links_are_publication_blockers"] is False

          validation = status["validation"]
          counts = status["source_counts"]
          assert status["deployment_status"] == "validated_complete_ready_to_commit"
          assert validation["passed"] is True
          assert validation["complete_inventory_gate"] is True
          assert validation["strict_public_access"] is True
          assert validation["fishnv_is_access_verification"] is False
          assert validation["dead_ndow_links_are_nonfatal_warnings"] is True
          assert counts["county_polygons"] == 17
          assert counts["ndow_water_metadata_records"] >= 300
          assert counts["ndow_water_metadata_counties"] == 17
          assert reports["public_water_count"] >= 25
          assert reports["verified_access_point_count"] >= 25
          assert reports["report_count"] >= 100

          # All 17 counties must be represented, but a county is not forced to
          # invent a public water when no official named access can be verified.
          assert validation["populated_counties"] + len(
              validation["counties_without_verified_public_access"]
          ) == 17
          for county in reports["counties"]:
              assert county["coverage_status"] in {
                  "verified_public_access_records_available",
                  "no_independently_verified_public_access_found",
              }
              assert county.get("coverage_note")

          assert unverified["metadata"]["publication_status"] == "not_published"
          assert unverified["count"] == reports["unverified_fishable_water_count"]
          assert unverified["count"] == audit["matching"]["quarantined_unverified_waters"]
          assert all(
              row["publication_status"] == "quarantined_unverified_public_access"
              for row in unverified["waters"]
          )

          def valid(lon, lat):
              try:
                  return -120.2 <= float(lon) <= -113.8 and 34.8 <= float(lat) <= 42.2
              except (TypeError, ValueError):
                  return False

          unique_points = set()
          for water in reports["flat_waters"]:
              assert water["publication_status"] == "published_verified_public_access"
              assert water.get("access_points"), water.get("water_name")
              lat, lon = water.get("latitude"), water.get("longitude")
              if lat not in (None, "") or lon not in (None, ""):
                  assert lat not in (None, "") and lon not in (None, "")
                  assert valid(lon, lat), (water.get("water_name"), lat, lon)
              for point in water["access_points"]:
                  unique_points.add(point["access_id"])
                  assert point["public_access_status"] == "verified_public"
                  assert point["entire_shoreline_public"] is False
                  assert point.get("access_point_name")
                  assert point.get("official_source_url", "").startswith("https://")
                  assert point.get("verification_evidence")
                  assert point.get("verification_method")
                  assert "fishnv" not in point["verification_method"].lower()
                  assert point["access_point_name"].lower() != "fishnv mapped fishing location"
                  plat, plon = point.get("latitude"), point.get("longitude")
                  if plat not in (None, "") or plon not in (None, ""):
                      assert plat not in (None, "") and plon not in (None, "")
                      assert valid(plon, plat), (
                          point.get("access_point_name"), plat, plon
                      )
                  directions = str(
                      point.get("directions_url") or ""
                  ).lower().replace("%2c", ",")
                  assert "query=null" not in directions
                  assert "query=undefined" not in directions
                  assert "query=0,0" not in directions
                  assert "query=," not in directions

          assert len(unique_points) == reports["verified_access_point_count"]

          page = Path("nevada-county-reports.html").read_text()
          assert "Nevada Verified Public Fishing Access" in page
          assert "FishNV supplies water and species information, but it does not prove public entry" in page
          assert "Independently verified access points" in page
          assert "nevada_unverified_fishable_waters" not in page
          assert "FishNV mapped fishing location" not in page

          update_text = Path("update_status.js").read_text()
          match = re.search(
              r"window\.FFO_UPDATE_STATUS\s*=\s*(\{.*\})\s*;",
              update_text,
              re.S,
          )
          assert match, "Could not parse update_status.js"
          admin = json.loads(match.group(1))
          assert "Nevada" in {row["state"] for row in admin.get("states", [])}

          print("Clean Nevada valid NDOW waters:", counts["ndow_water_metadata_records"])
          print("Clean Nevada dead links ignored:", counts["ndow_water_unresolved_pages"])
          print("Clean Nevada verified waters:", reports["public_water_count"])
          print("Clean Nevada verified access points:", reports["verified_access_point_count"])
          print("Clean Nevada official reports:", reports["report_count"])
          print("Clean Nevada populated counties:", validation["populated_counties"])
          print(
              "Counties with no independently verified access:",
              validation["counties_without_verified_public_access"],
          )
          PY

          git diff --check

      - name: Commit clean Nevada data and website integration
        shell: bash
        run: |
          FILES=(
            data/nevada_*
            config/nevada_*
            nevada-county-reports.html
            brand-shell.js
            service-worker.js
            sitemap.xml
            recent_fishing_reports.js
            update_status.js
          )
          if [[ -z "$(git status --porcelain -- "${FILES[@]}")" ]]; then
            echo "No Nevada fishing-data changes to commit."
            exit 0
          fi
          git config user.name "Fish Finder Outdoors Clean Nevada Builder"
          git config user.email "actions@users.noreply.github.com"
          git add "${FILES[@]}"
          git commit -m "Rebuild Nevada verified public fishing access cleanly"
          git push
