name: Update Washington Fishing Data — Official Public Access

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "build_washington_fishing_data.py"
      - "build_official_species_index.py"
      - "refresh_official_species_sources.py"
      - "data/official_species_sources.json"
      - ".github/workflows/update-all-washington-fishing-data.yml"
  schedule:
    - cron: "47 16 * * *"

permissions:
  contents: write

concurrency:
  group: washington-official-public-fishing-access
  cancel-in-progress: false

jobs:
  build-washington:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run offline Washington safety tests
        run: python build_washington_fishing_data.py --self-test
      - name: Refresh Washington from official sources when available
        shell: bash
        run: |
          set -o pipefail
          if python build_washington_fishing_data.py --root . --output-dir data; then
            echo "Washington official refresh completed."
          else
            echo "WDFW refresh was unavailable; preserving the verified Washington baseline already in the repository."
          fi
      - name: Refresh exact Washington lake species and browser index
        run: |
          python refresh_official_species_sources.py --state Washington --workers 6
          python build_official_species_index.py
      - name: Validate Washington output structure
        shell: bash
        run: |
          set -euo pipefail
          required_files=(
            data/washington_counties.csv
            config/washington_counties.json
            data/washington_public_fishing_access.json
            data/washington_public_fishing_access.js
            data/washington_fishing_report_database.json
            data/washington_fishing_report_database.js
            data/washington_fishing_report_database.csv
            data/washington_source_audit.json
            data/washington_project_status.json
            washington-county-reports.html
          )
          for file in "${required_files[@]}"; do
            test -s "$file" || { echo "Missing or empty output: $file"; exit 1; }
          done
          python - <<'PY'
          import json
          from pathlib import Path
          db=json.loads(Path("data/washington_fishing_report_database.json").read_text())
          status=json.loads(Path("data/washington_project_status.json").read_text())
          audit=json.loads(Path("data/washington_source_audit.json").read_text())
          expected=["Adams","Asotin","Benton","Chelan","Clallam","Clark","Columbia","Cowlitz","Douglas","Ferry","Franklin","Garfield","Grant","Grays Harbor","Island","Jefferson","King","Kitsap","Kittitas","Klickitat","Lewis","Lincoln","Mason","Okanogan","Pacific","Pend Oreille","Pierce","San Juan","Skagit","Skamania","Snohomish","Spokane","Stevens","Thurston","Wahkiakum","Walla Walla","Whatcom","Whitman","Yakima"]
          assert db["county_count"]==39
          assert [row["county"] for row in db["counties"]]==expected
          assert db["metadata"]["public_access_only"] is True
          assert db["public_water_count"]>0 and db["verified_access_point_count"]>0
          assert status["validation"]["passed"] is True
          source=audit["sources"]["water_access"]
          assert source["complete"] is True
          assert int(source.get("downloaded_feature_count",0))>0
          if "advertised_object_id_count" in source:
              assert source["advertised_object_id_count"]==source["downloaded_feature_count"]
          unique=set()
          for water in db["flat_waters"]:
              assert water["access_points"]
              for point in water["access_points"]:
                  assert point["public_access_status"]=="verified_public"
                  assert point["entire_shoreline_public"] is False
                  unique.add(point["access_id"])
          assert len(unique)==db["verified_access_point_count"]
          recent=Path("recent_fishing_reports.js").read_text()
          assert '"state": "Idaho"' in recent
          assert '"state": "Washington"' in recent
          print("Washington verified waters:",db["public_water_count"])
          print("Washington access points:",db["verified_access_point_count"])
          PY
          git diff --check
      - name: Commit Washington refresh when changed
        shell: bash
        run: |
          files=(data/washington_* data/official_species_sources.json config/washington_* washington-county-reports.html brand-shell.js service-worker.js sitemap.xml recent_fishing_reports.js update_status.js official_species_index.js)
          if [[ -z "$(git status --porcelain -- "${files[@]}")" ]]; then
            echo "No Washington changes to commit."
            exit 0
          fi
          git config user.name "Fish Finder Outdoors Washington Builder"
          git config user.email "actions@users.noreply.github.com"
          git add "${files[@]}"
          git commit -m "Update Washington official public fishing access"
          git push
