name: Update All Wyoming Fishing Data

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "build_wyoming_fishing_data.py"
      - ".github/workflows/update-all-wyoming-fishing-data.yml"
  schedule:
    - cron: "17 15 * * *"

permissions:
  contents: write

concurrency:
  group: all-wyoming-fishing-data
  cancel-in-progress: false

jobs:
  update-all-wyoming-fishing-data:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install report parser
        run: python -m pip install --disable-pip-version-check beautifulsoup4==4.13.4

      - name: Build Wyoming fishing data
        run: |
          python build_wyoming_fishing_data.py \
            --root . \
            --output-dir data

      - name: Validate Wyoming output files and counties
        shell: bash
        run: |
          test -s data/wyoming_counties.csv
          test -s config/wyoming_counties.json
          test -s data/wyoming_public_fishing_access.json
          test -s data/wyoming_public_fishing_access.js
          test -s data/wyoming_fishing_report_database.json
          test -s data/wyoming_fishing_report_database.js
          test -s data/wyoming_fishing_report_database.csv
          test -s data/wyoming_project_status.json
          test -s wyoming-county-reports.html
          python - <<'PY'
          import json
          from pathlib import Path

          reports = json.loads(Path("data/wyoming_fishing_report_database.json").read_text())

          assert reports["county_count"] == 23
          assert len(reports["counties"]) == 23
          assert reports["counties"][0]["county"] == "Albany"
          assert reports["counties"][-1]["county"] == "Weston"
          assert [c["county_number"] for c in reports["counties"]] == list(range(1, 24))
          assert reports["metadata"]["public_access_only"] is True

          print("Wyoming public waters:", reports["public_water_count"])
          print("Wyoming report records:", reports["report_count"])
          PY

      - name: Commit Wyoming data changes
        shell: bash
        run: |
          FILES=(
            data/wyoming_*
            config/wyoming_*
            wyoming-county-reports.html
            brand-shell.js
            service-worker.js
            sitemap.xml
            recent_fishing_reports.js
            update_status.js
          )

          if [[ -z "$(git status --porcelain -- "${FILES[@]}")" ]]; then
            echo "No Wyoming fishing-data changes to commit."
            exit 0
          fi

          git config user.name "Fish Finder Outdoors Wyoming Builder"
          git config user.email "actions@users.noreply.github.com"
          git add "${FILES[@]}"
          git commit -m "Update Wyoming public access and fishing reports"
          git push
