name: Update All Nevada Fishing Data — Verified Public Access

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: all-nevada-fishing-data-verified-access
  cancel-in-progress: false

jobs:
  update-all-nevada-fishing-data:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install official-page parser
        run: python -m pip install --disable-pip-version-check beautifulsoup4==4.13.4

      - name: Run Nevada offline safety tests
        run: python build_nevada_fishing_data.py --self-test

      - name: Validate the checked-in Nevada baseline
        run: |
          python build_nevada_fishing_data.py \
            --root . \
            --output-dir data \
            --validate-existing

      - name: Attempt fresh Nevada official-source update
        shell: bash
        run: |
          set +e
          timeout 75m python build_nevada_fishing_data.py \
            --root . \
            --output-dir data 2>&1 | tee /tmp/nevada-refresh.log
          refresh_status=${PIPESTATUS[0]}
          set -e

          if [[ ${refresh_status} -eq 0 ]]; then
            if python build_nevada_fishing_data.py \
              --root . \
              --output-dir data \
              --validate-existing; then
              echo "NEVADA_REFRESH_MODE=live" >> "$GITHUB_ENV"
              echo "### Nevada refresh" >> "$GITHUB_STEP_SUMMARY"
              echo "Fresh official-source data passed all Nevada validation checks." >> "$GITHUB_STEP_SUMMARY"
              exit 0
            fi
            refresh_status=1
          fi

          echo "Nevada live refresh could not pass safely; restoring the verified checked-in baseline."
          git restore --worktree --source=HEAD -- \
            data/nevada_* \
            config/nevada_* \
            nevada-county-reports.html \
            brand-shell.js \
            service-worker.js \
            sitemap.xml \
            recent_fishing_reports.js \
            update_status.js
          git clean -f -- data/nevada_* config/nevada_*

          python build_nevada_fishing_data.py \
            --root . \
            --output-dir data \
            --validate-existing

          echo "NEVADA_REFRESH_MODE=verified-baseline" >> "$GITHUB_ENV"
          echo "### Nevada refresh" >> "$GITHUB_STEP_SUMMARY"
          echo "The official websites did not produce a complete safe refresh, so the verified Nevada baseline was preserved." >> "$GITHUB_STEP_SUMMARY"
          echo "The run remains green because no unverified or incomplete replacement data was published." >> "$GITHUB_STEP_SUMMARY"

      - name: Rebuild exact-water species index
        run: |
          python refresh_official_species_sources.py --state Nevada
          python build_official_species_index.py

      - name: Check generated files
        run: git diff --check

      - name: Commit safe Nevada changes
        shell: bash
        run: |
          FILES=(
            data/nevada_*
            config/nevada_*
            nevada-county-reports.html
            brand-shell.js
            service-worker.js
            sitemap.xml
            recent_fishing_reports.js
            update_status.js
            data/official_species_sources.json
            official_species_index.js
          )

          if [[ -z "$(git status --porcelain -- "${FILES[@]}")" ]]; then
            echo "No safe Nevada data changes to commit. Refresh mode: ${NEVADA_REFRESH_MODE:-unknown}."
            exit 0
          fi

          git config user.name "Fish Finder Outdoors Nevada Builder"
          git config user.email "actions@users.noreply.github.com"
          git add "${FILES[@]}"
          git commit -m "Update Nevada verified public fishing access and reports"
          git push
