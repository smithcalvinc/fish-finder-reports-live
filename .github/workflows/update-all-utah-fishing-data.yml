name: Update All Utah Fishing Data

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "build_utah_fishing_data.py"
      - "data/utah_public_social_reports.csv"
      - "config/utah_water_aliases.json"
      - ".github/workflows/update-all-utah-fishing-data.yml"
  schedule:
    - cron: "17 14 * * *"

permissions:
  contents: write

concurrency:
  group: all-utah-fishing-data
  cancel-in-progress: false

jobs:
  update-all-utah-fishing-data:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install report parser
        run: python -m pip install --disable-pip-version-check beautifulsoup4==4.13.4

      - name: Build Utah fishing data
        run: |
          python build_utah_fishing_data.py \
            --root . \
            --output-dir data

      - name: Validate Utah output files and counties
        shell: bash
        run: |
          test -s data/utah_counties.csv
          test -s config/utah_counties.json
          test -s data/utah_public_fishing_access.json
          test -s data/utah_public_fishing_access.js
          test -s data/utah_fishing_report_database.json
          test -s data/utah_fishing_report_database.js
          test -s data/utah_fishing_report_database.csv
          test -s data/utah_project_status.json
          test -s utah-county-reports.html
          python - <<'PY'
          import json
          from pathlib import Path

          reports = json.loads(Path("data/utah_fishing_report_database.json").read_text())

          assert reports["county_count"] == 29
          assert len(reports["counties"]) == 29
          assert reports["counties"][0]["county"] == "Beaver"
          assert reports["counties"][-1]["county"] == "Weber"
          assert [c["county_number"] for c in reports["counties"]] == list(range(1, 30))
          assert reports["metadata"]["public_access_only"] is True

          print("Utah public waters:", reports["public_water_count"])
          print("Utah report records:", reports["report_count"])
          PY

      - name: Commit Utah data changes
        shell: bash
        run: |
          FILES=(
            data/utah_*
            config/utah_*
            utah-county-reports.html
            brand-shell.js
            service-worker.js
            sitemap.xml
            recent_fishing_reports.js
            update_status.js
          )

          if [[ -z "$(git status --porcelain -- "${FILES[@]}")" ]]; then
            echo "No Utah fishing-data changes to commit."
            exit 0
          fi

          git config user.name "Fish Finder Outdoors Utah Builder"
          git config user.email "actions@users.noreply.github.com"
          git add "${FILES[@]}"
          git commit -m "Update Utah public access and fishing reports"
          git push
