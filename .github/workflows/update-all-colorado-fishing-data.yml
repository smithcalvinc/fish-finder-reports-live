name: Update All Colorado Fishing Data

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "build_colorado_fishing_data.py"
      - ".github/workflows/update-all-colorado-fishing-data.yml"
  schedule:
    - cron: "47 14 * * *"

permissions:
  contents: write

concurrency:
  group: all-colorado-fishing-data
  cancel-in-progress: false

jobs:
  update-all-colorado-fishing-data:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install report parser
        run: python -m pip install --disable-pip-version-check beautifulsoup4==4.13.4

      - name: Build Colorado fishing data
        run: |
          python build_colorado_fishing_data.py \
            --root . \
            --output-dir data

      - name: Validate Colorado output files and counties
        shell: bash
        run: |
          test -s data/colorado_counties.csv
          test -s config/colorado_counties.json
          test -s data/colorado_public_fishing_access.json
          test -s data/colorado_public_fishing_access.js
          test -s data/colorado_fishing_report_database.json
          test -s data/colorado_fishing_report_database.js
          test -s data/colorado_fishing_report_database.csv
          test -s data/colorado_project_status.json
          test -s colorado-county-reports.html
          python - <<'PY'
          import json
          from pathlib import Path

          reports = json.loads(Path("data/colorado_fishing_report_database.json").read_text())

          assert reports["county_count"] == 64
          assert len(reports["counties"]) == 64
          assert reports["counties"][0]["county"] == "Adams"
          assert reports["counties"][-1]["county"] == "Yuma"
          assert [c["county_number"] for c in reports["counties"]] == list(range(1, 65))
          assert reports["metadata"]["public_access_only"] is True

          print("Colorado public waters:", reports["public_water_count"])
          print("Colorado report records:", reports["report_count"])
          PY

      - name: Commit Colorado data changes
        shell: bash
        run: |
          FILES=(
            data/colorado_*
            config/colorado_*
            colorado-county-reports.html
            brand-shell.js
            service-worker.js
            sitemap.xml
            recent_fishing_reports.js
            update_status.js
          )

          if [[ -z "$(git status --porcelain -- "${FILES[@]}")" ]]; then
            echo "No Colorado fishing-data changes to commit."
            exit 0
          fi

          git config user.name "Fish Finder Outdoors Colorado Builder"
          git config user.email "actions@users.noreply.github.com"
          git add "${FILES[@]}"
          git commit -m "Update Colorado public access and fishing reports"
          git push
