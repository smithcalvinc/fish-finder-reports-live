<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1F4D3A">
<title>Updating Fish Finder Outdoors</title>
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f5f2e8;color:#14211e;font-family:Arial,sans-serif;padding:24px;box-sizing:border-box}
main{max-width:520px;background:#fffdf8;border:2px solid #1f4d3a;border-radius:16px;padding:26px;text-align:center}
h1{margin-top:0;color:#1f4d3a}.spinner{width:44px;height:44px;margin:20px auto;border:5px solid #d9e2dd;border-top-color:#1f4d3a;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
p{line-height:1.5}button{display:none;margin:18px auto 0;padding:12px 18px;border:0;border-radius:10px;background:#1f4d3a;color:white;font-weight:700}
</style>
</head>
<body>
<main>
<h1>Updating Fish Finder Outdoors</h1>
<div class="spinner" id="spinner"></div>
<p id="message">Clearing the old phone-app layout and loading the newest version…</p>
<button id="continueButton" type="button">Open Updated App</button>
</main>
<script>
(async()=>{
  const message=document.getElementById('message');
  const button=document.getElementById('continueButton');
  try{
    if('caches' in window){
      const keys=await caches.keys();
      await Promise.all(keys.map(key=>caches.delete(key)));
    }
    if('serviceWorker' in navigator){
      const registrations=await navigator.serviceWorker.getRegistrations();
      await Promise.all(registrations.map(reg=>reg.unregister()));
    }
    message.textContent='Update complete. Opening the newest search layout…';
    setTimeout(()=>location.replace('./index.html?fresh='+Date.now()),800);
  }catch(error){
    document.getElementById('spinner').style.display='none';
    message.textContent='The automatic refresh was blocked. Tap below to open the newest page.';
    button.style.display='block';
    button.addEventListener('click',()=>location.replace('./index.html?fresh='+Date.now()));
  }
})();
</script>
</body>
</html>
